# nginx interno del contenedor "frontend". El nginx del host sólo hace proxy a este puerto.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Avisos en vivo (Server-Sent Events): sin buffer y con conexión larga.
    location = /api/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Fotos del catálogo de 100 modelos: las sirve el agente. Con variable y el DNS de Docker
    # el nombre se resuelve en cada petición: si el agente está apagado, el panel arranca igual.
    location /media/catalogo/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $agente http://agente:8000;
        proxy_pass $agente;
        proxy_intercept_errors on;
        expires 1d;
    }

    location /media/ {
        proxy_pass http://backend:8080;
        expires 1d;
    }

    # El webhook de WhatsApp es interno (evolution → backend); no se expone.
    location /webhook/ {
        return 404;
    }

    # Rutas internas del backend (el agente avisa al CRM los turnos del chat web): solo dentro de la red de Docker.
    location /api/internal/ {
        return 404;
    }

    # Archivos con hash: caché larga.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}
