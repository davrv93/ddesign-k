<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JMD Ventas</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --bg:#f5f5f7; --card:#fff; --accent:#6d1f45; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f5f5f7; --muted:#a1a1a6; --bg:#111; --card:#1c1c1e; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  main { background:var(--card); border-radius:18px; padding:32px; width:100%; max-width:380px;
    box-shadow:0 10px 30px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:26px; }
  p { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-size:14px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #c7c7cc; font-size:16px;
    background:transparent; color:var(--fg); }
  button { margin-top:14px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent);
    color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>JMD Ventas</h1>
  <p>CRM de pedidos por WhatsApp. Entra al panel de tu empresa.</p>
  <form id="f">
    <label for="e">Empresa</label>
    <input id="e" name="e" placeholder="p. ej. baruka" autocomplete="organization" autocapitalize="none" required
      pattern="[a-z0-9][a-z0-9\-]{1,39}">
    <button>Entrar</button>
  </form>
</main>
<script>
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var e = document.getElementById("e").value.trim().toLowerCase();
    if (e) location.href = "/jmdventas/" + encodeURIComponent(e) + "/login/";
  });
</script>
</body>
</html>
