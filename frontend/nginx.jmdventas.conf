# nginx del panel de JMD Ventas (multiempresa). El borde quita «/jmdventas» y llega aquí /<empresa>/….
#
# Una sola compilación para todas las empresas: el panel se compila con BASE_PATH=/jmdventas/XEMPRESAX/ y aquí
# sub_filter cambia ese marcador por la empresa de la ruta en el HTML, el JS y el JSON. Así las rutas, los enlaces y
# las llamadas a la API (/jmdventas/<empresa>/api/…) salen de la URL, sin compilar nada por empresa.
# La API y las fotos van al backend con la ruta entera (/<empresa>/api/…): el backend resuelve la empresa.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Portada de JMD Ventas (sin empresa). No lista las empresas.
    location = / {
        root /usr/share/nginx/jmd;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Empresas de la portada (solo slug, nombre, orden, color, logo y productos activos). Va antes que las rutas por
    # empresa: «api» no es una empresa.
    location = /api/empresas {
        proxy_pass http://jmd-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # El webhook de WhatsApp y las rutas internas no se exponen.
    location ~ ^/[^/]+/(webhook|api/internal)(/|$) {
        return 404;
    }

    # Avisos en vivo (SSE): sin buffer y con conexión larga.
    location ~ "^/[a-z0-9][a-z0-9-]{1,39}/api/events$" {
        proxy_pass http://jmd-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ "^/[a-z0-9][a-z0-9-]{1,39}/api/" {
        proxy_pass http://jmd-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location ~ "^/[a-z0-9][a-z0-9-]{1,39}/media/" {
        proxy_pass http://jmd-backend:8080;
        expires 1d;
    }

    # /jmdventas/baruka → /jmdventas/baruka/
    location ~ "^/(?<empresa>[a-z0-9][a-z0-9-]{1,39})$" {
        return 301 /jmdventas/$empresa/;
    }

    # Archivos con hash: caché larga (la URL ya lleva la empresa, así que no se mezclan entre empresas).
    location ~ "^/(?<empresa>[a-z0-9][a-z0-9-]{1,39})/(?<resto>(build|assets)/.+)$" {
        sub_filter 'jmdventas/XEMPRESAX/' 'jmdventas/$empresa/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/json text/css image/svg+xml;
        try_files /$resto =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Páginas del panel (y q-data.json de la navegación de Qwik).
    location ~ "^/(?<empresa>[a-z0-9][a-z0-9-]{1,39})(?<resto>/.*)$" {
        sub_filter 'jmdventas/XEMPRESAX/' 'jmdventas/$empresa/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/json text/css image/svg+xml;
        try_files ${resto}index.html $resto/index.html $resto =404;
        add_header Cache-Control "no-cache";
    }
}
