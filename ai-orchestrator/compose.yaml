# Funciona igual con:
#   docker compose up -d --build
#   podman compose up -d --build      (o podman-compose up -d --build)
#
# Las variables salen de .env (copia .env.example). La configuración viva y la telemetría
# quedan en el volumen aio_data (/data dentro del contenedor).

services:
  orchestrator:
    build: .
    image: localhost/ai-orchestrator:latest
    container_name: ai-orchestrator
    ports:
      # Solo en local. Para exponerlo, pon un proxy con HTTPS delante (o cambia a "4000:4000").
      - "127.0.0.1:${AIO_PORT:-4000}:4000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - aio_data:/data
    restart: unless-stopped

volumes:
  aio_data:
