# ai-orchestrator — configuración semilla.
#
# Al primer arranque se copia a data/config.yaml; desde ahí la edita la UI (/ui/) y se
# aplica en caliente. Este archivo solo vuelve a leerse si borras data/config.yaml.
#
# Todos los proveedores hablan formato OpenAI: POST {base_url}/chat/completions y
# GET {base_url}/models. Añadir uno = base_url + clave.
#
# Los nombres de modelo (`deployments[].model`) de los proveedores gratuitos cambian a
# menudo y NO se pudieron comprobar al escribir esto: en la UI, «Proveedores → Ver
# modelos» lista los que existen de verdad y marca los que no.

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://github.com/davrv93/ddesign-k
      X-Title: ai-orchestrator
    quota:
      balance: openrouter          # GET /key → saldo y límite de la clave
      # Capa gratis de OpenRouter para modelos :free (50/día; 1000/día con ≥10 US$ de créditos).
      requests_per_day: 50
      requests_per_minute: 20
  opencode:
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
    quota:
      balance: none
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    quota:
      balance: none
      reset_utc_offset_hours: -8   # AI Studio reinicia a medianoche del Pacífico
  # Ejemplo de proveedor con saldo propio (formato OpenAI):
  # deepseek:
  #   base_url: https://api.deepseek.com/v1
  #   api_key_env: DEEPSEEK_API_KEY
  #   quota: {balance: deepseek, balance_url: https://api.deepseek.com/user/balance}

# ---------------------------------------------------------------------------
# Modelos (grupos). capabilities: text code reasoning tools json image audio video pdf
# cost: 0 gratis · 1 barato · 2 normal · 3 caro. Deployments en orden de preferencia.
# requests_per_day/minute en un deployment = cuota de ESE modelo (p. ej. Gemini gratis).
# ---------------------------------------------------------------------------
models:
  laguna:
    capabilities: [text, code, tools, json]
    context: 131072
    cost: 0
    deployments:
      - {provider: openrouter, model: "poolside/laguna-s-2.1:free"}
  muse-spark:
    capabilities: [text, code, tools, json, reasoning]
    context: 131072
    cost: 0
    deployments:
      - {provider: opencode, model: "muse-spark-1.3-contributor-free"}
  nemotron-ultra:
    capabilities: [text, code, reasoning, tools, json]
    context: 131072
    cost: 0
    deployments:
      - {provider: openrouter, model: "nvidia/nemotron-3-ultra:free"}
  nemotron-super:
    capabilities: [text, code, reasoning, tools, json]
    context: 131072
    cost: 0
    deployments:
      - {provider: openrouter, model: "nvidia/nemotron-3-super:free"}
      - {provider: opencode, model: "nemotron-3-super-free"}
  nemotron-nano-omni:
    capabilities: [text, image, audio, video, json]
    context: 131072
    cost: 0
    deployments:
      - {provider: openrouter, model: "nvidia/nemotron-3-nano-omni:free"}
  inkling:
    capabilities: [text, code, reasoning, tools, json, image]
    context: 131072
    cost: 0
    deployments:
      - {provider: openrouter, model: "inkling/inkling:free"}
  gemini-flash:
    capabilities: [text, code, tools, json, image, audio, video, pdf]
    context: 1048576
    cost: 1
    deployments:
      - {provider: gemini, model: "gemini-2.5-flash"}
  gemini-flash-lite:
    capabilities: [text, tools, json, image, audio, video, pdf]
    context: 1048576
    cost: 0
    deployments:
      - {provider: gemini, model: "gemini-2.5-flash-lite"}
  gemini-pro:
    capabilities: [text, code, reasoning, tools, json, image, audio, video, pdf]
    context: 1048576
    cost: 2
    deployments:
      - {provider: gemini, model: "gemini-2.5-pro"}
  free-auto:
    # Router de modelos gratis de OpenRouter: último recurso.
    capabilities: [text, code, tools, json, image]
    context: 32768
    cost: 0
    deployments:
      - {provider: openrouter, model: "openrouter/free"}

# ---------------------------------------------------------------------------
# Agentes. Cada uno es también un `model` que la aplicación puede pedir.
# `chain` es el orden por defecto; el aprendizaje lo reordena con la telemetría.
# ---------------------------------------------------------------------------
agents:
  general:
    description: Conversación y tareas simples
    chain: [gemini-flash-lite, nemotron-super, inkling, free-auto]
    priority: speed
  cheap:
    description: Lo más barato que responda
    chain: [gemini-flash-lite, nemotron-super, free-auto, gemini-flash]
    priority: cost
  coding:
    description: "Código: escribir, revisar, depurar"
    chain: [laguna, muse-spark, nemotron-super, inkling, gemini-flash]
    priority: quality
    params: {temperature: 0.2}
  coding-fast:
    description: Código corto y rápido (autocompletar, un fix pequeño)
    chain: [laguna, gemini-flash, nemotron-super, muse-spark]
    priority: speed
    params: {temperature: 0.2}
  coding-deep:
    description: Refactors grandes, arquitectura, bugs difíciles
    chain: [muse-spark, laguna, nemotron-ultra, inkling, gemini-pro]
    priority: quality
    timeout: 300
    params: {temperature: 0.1}
  reasoning:
    description: Análisis, matemáticas, planificación
    chain: [nemotron-ultra, inkling, gemini-pro, nemotron-super]
    priority: quality
    timeout: 240
  multimodal:
    description: Imagen, audio o vídeo
    chain: [gemini-flash, nemotron-nano-omni, inkling, gemini-pro]
    priority: quality
  vision:
    description: Solo imágenes
    chain: [gemini-flash, inkling, nemotron-nano-omni, gemini-pro]
    priority: quality
  document:
    description: PDFs y documentos largos
    chain: [gemini-flash, gemini-pro, nemotron-super]
    priority: quality
    timeout: 240
  research:
    description: Investigar, comparar, sintetizar
    chain: [nemotron-ultra, gemini-pro, inkling, gemini-flash]
    priority: quality
    timeout: 240

default_profile: auto

router:
  rules_min_confidence: 0.75     # nivel 0: si las reglas están así de seguras, no se llama al juez
  long_context_tokens: 32000
  judge:                         # nivel 1: juez con salida estructurada
    enabled: true
    chain: [gemini-flash-lite, gemini-flash, nemotron-super]
    timeout: 10
    cache_size: 512
    max_chars: 6000

# ---------------------------------------------------------------------------
# Fiabilidad por tipo de error:
#   retries  reintentos en el MISMO modelo (backoff exponencial, respeta Retry-After)
#   fallback pasar al siguiente modelo (false = el error va al cliente)
#   cooldown segundos fuera tras abandonarlo     breaker  cuenta para el circuit breaker
# ---------------------------------------------------------------------------
reliability:
  policy:
    rate_limit:   {retries: 2, fallback: true,  cooldown: 30,   breaker: true}    # 429
    quota:        {retries: 0, fallback: true,  cooldown: 3600, breaker: true}    # 402 / cuota agotada
    timeout:      {retries: 1, fallback: true,  cooldown: 0,    breaker: true}    # 408 / 504 / timeout
    server_error: {retries: 2, fallback: true,  cooldown: 0,    breaker: true}    # 5xx
    unavailable:  {retries: 0, fallback: true,  cooldown: 60,   breaker: true}    # modelo caído / sin endpoints
    auth:         {retries: 0, fallback: true,  cooldown: 600,  breaker: false}   # 401 / 403
    not_found:    {retries: 0, fallback: true,  cooldown: 3600, breaker: false}   # 404 modelo inexistente
    context:      {retries: 0, fallback: true,  cooldown: 0,    breaker: false}   # contexto excedido
    unsupported:  {retries: 0, fallback: true,  cooldown: 0,    breaker: false}   # no admite imagen, tools…
    bad_request:  {retries: 0, fallback: false, cooldown: 0,    breaker: false}   # 400: la petición está mal
    connection:   {retries: 2, fallback: true,  cooldown: 0,    breaker: true}
  backoff: {base: 0.5, max: 8, respect_retry_after: true, max_retry_after: 20}
  circuit_breaker: {failure_threshold: 5, window: 60, open_seconds: 30}
  default_timeout: 120           # s por intento
  deadline: 300                  # s para toda la petición, con fallbacks

learning:
  enabled: true
  window_days: 14
  min_samples: 20                # por (tarea, modelo) para que sus datos pesen del todo
  exploration: 0.05              # probabilidad de probar primero un modelo con pocos datos
  latency_ref: 10                # s: latencia que puntúa 0,5
  weights:
    quality: {quality: 0.55, success: 0.35, speed: 0.10, cost: 0.00}
    speed:   {quality: 0.25, success: 0.30, speed: 0.45, cost: 0.00}
    cost:    {quality: 0.20, success: 0.30, speed: 0.10, cost: 0.40}

# ---------------------------------------------------------------------------
# Ahorro de tokens (para cualquier cliente: Claude Code, OpenCode, jmd chat…)
#   style: off · lite · full · ultra   respuestas cortas, a la manera de caveman
#   compress_tool_output               limpia y recorta salidas de herramientas largas,
#                                      a la manera de RTK pero en el servidor
# Por petición: cabecera X-JMD-Style o "orchestrator": {"style": "full"}.
# ---------------------------------------------------------------------------
savings:
  style: "off"
  compress_tool_output: false
  tool_output_max_chars: 12000

# Nombres de modelo de los clientes → perfil del gateway (`*` comodín; gana el más específico).
compat:
  model_aliases:
    "claude-*opus*": coding-deep
    "claude-*sonnet*": coding
    "claude-*haiku*": cheap
    "gpt-*": auto
