# Sitio del CRM en el nginx del HOST (EC2). Copiar a /etc/nginx/sites-available/kddesign
# y enlazar en sites-enabled. Luego:  sudo certbot --nginx -d kddesign.pjgfactsalud.com.pe
# (certbot agrega el bloque 443 con el certificado y la redirección HTTP→HTTPS).
#
# Sólo hace proxy a 127.0.0.1:18480 (contenedor kddesign_frontend): no toca los demás sitios.

server {
    listen 80;
    listen [::]:80;
    server_name kddesign.pjgfactsalud.com.pe;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Avisos en vivo del panel (SSE): sin buffer.
    location = /api/events {
        proxy_pass http://127.0.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
