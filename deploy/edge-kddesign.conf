# kddesign.duckdns.org -> isolated Baruka Design CRM frontend.
# >>> kddesign.duckdns.org >>>
server {
    listen 80;
    server_name kddesign.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name kddesign.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/kddesign.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kddesign.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $upstream_kddesign kddesign_frontend:80;
        proxy_pass http://$upstream_kddesign;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# <<< kddesign.duckdns.org <<<
