# Catálogo 7 de CATALOGOS_PROPUESTOS.md: objeciones de compra (las 11 del documento). Frases SINTÉTICAS.
# Una objeción es una duda o freno que deja la puerta abierta; el rechazo (rechazo.yaml) la cierra. Aquí se redactan como
# duda/freno («¿no será muy corto?»), allá como descarte («muy corto, no»). Clasifica; no contesta ni inventa datos.
catalogo: objeciones
version: 1
descripcion: "Frenos y dudas de la clienta antes de comprar. No son un «no»: piden una respuesta o una garantía."
minimo_ejemplos: 20
