# Catálogo 9 de CATALOGOS_PROPUESTOS.md: rechazo (distinto de una objeción: modifica de inmediato el perfil temporal de la
# conversación). Frases SINTÉTICAS. Se redactan como descarte firme («muy largo, no»), a diferencia de las objeciones
# (dudas abiertas). Cada intención lleva en `slots` el atributo que actualiza en el perfil negativo de la clienta.
catalogo: rechazo
version: 1
descripcion: "La clienta descarta la prenda o un rasgo de ella. Actualiza lo que NO quiere ver; no abre una duda."
minimo_ejemplos: 20
