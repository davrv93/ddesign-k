# Catálogo 17 de CATALOGOS_PROPUESTOS.md: referencias contextuales. Este catálogo solo DETECTA que la frase refiere a una
# prenda ya mostrada y de qué manera; QUIÉN es la prenda lo resuelve `resolver_referencia` (referencias.py), de forma
# determinista, contra la lista de candidatos de la conversación. Frases SINTÉTICAS (no hay chats reales).
