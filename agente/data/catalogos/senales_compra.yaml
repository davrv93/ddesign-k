# Catálogos 8 (señales de interés / de compra) y 20 (etapa comercial) de CATALOGOS_PROPUESTOS.md, en uno: cada intención
# trae `strength` (0–1: qué tan cerca de comprar) y `stage` (etapa comercial del documento: DISCOVERY → NEED_IDENTIFIED →
# RECOMMENDATION → EVALUATION → OBJECTION → PURCHASE_INTENT → CHECKOUT → POSTSALE) y `etapa_bot` (las etapas del agente:
# prospeccion | seguimiento | cierre | venta_confirmada). Los valores de `strength` son una PROPUESTA ordinal para decidir cuándo
# dejar de preguntar y cerrar, no una probabilidad medida. Frases SINTÉTICAS.
catalogo: senales_compra
version: 1
descripcion: "Señales de interés y de compra con fuerza y etapa. Nunca confirma un pedido: eso lo decide la máquina de etapas."
