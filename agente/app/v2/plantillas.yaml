  # ------------------------------------------------------------------------------------------------------------------------
  # RETOMAS (cambios de tema): lo que se dice DESPUÉS de contestar lo que ella preguntó, para volver al dato que quedó pendiente.
  # Nunca repiten la pregunta de V1 con las mismas palabras (una prueba lo exige) y cada pregunta lleva la clave de V1 de su slot
  # (memoria.clave_de), para que la memoria de V1 reconozca qué se está esperando. Una sola pregunta por retoma. La frase de la pregunta
  # no la elige el modelo: se fija por intento (el segundo intento usa otras palabras que el primero).
  # modo obligatorio = sin eso no se compra · util = se retoma suave · ayuda:* = ella dijo que no sabe, duda o contestó ambiguo.
  # ------------------------------------------------------------------------------------------------------------------------
  RESUME_SIZE_REQUIRED:
    tipo: retoma
    clave: talla
    modo: obligatorio
    activa: true
    acciones: [responder_y_retomar]
    objetivo: obtener_talla_antes_de_separar
    semantica: [explicar_que_sin_talla_no_se_avanza, preguntar_TALLA, ofrecer_respuestas_faciles, no_sugerir_talla]
    protegidos: [PRODUCTO]
    prohibido: [inferir_talla, decir_que_talla_le_quedara, prometer_reserva, hacer_multiples_preguntas]
    max_frases: 3
    fijas: {}
    forma: "{puente} {emoji} {pregunta}"
    partes:
      puente: ["Para separar {{PRODUCTO}} todavía necesito confirmar tu talla.", "Para dejar {{PRODUCTO}} listo, solo me falta tu talla.",
               "Para avanzar con tu pedido todavía necesito tu talla."]
      pregunta: ["¿Qué talla usas: S, M o L, o prefieres pasarme tus medidas?", "¿Qué talla te corresponde (S, M o L) o prefieres pasarme tus medidas?",
                 "¿Cuál es tu talla habitual: S, M o L, o prefieres pasarme tus medidas?"]
      emoji: ["😊", ""]

