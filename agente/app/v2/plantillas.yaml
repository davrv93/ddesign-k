    acciones: [preguntar, recomendar]
    objetivo: obtener_color_preferido
    semantica: [preguntar_color]
    protegidos: [PREGUNTA_V1]
    prohibido: [asumir_color, agregar_colores, hacer_multiples_preguntas]
