    forma: "{pregunta}"
    partes:
      pregunta: ["{{PREGUNTA_V1}}", "¿Para cuándo es {{OCASION_ART}}?", "¿Para qué fecha lo necesitas?", "¿Para cuándo lo necesitas?", "¿Ya tienes fecha?"]

