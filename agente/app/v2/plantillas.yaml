# Plantillas semánticas de la V2 (Baruka). El modelo NO escribe ventas: elige o reescribe entre estas piezas.
#
# Cómo se usa una plantilla (app/v2/plantillas.py y realizador.py):
#   1. El código decide QUÉ decir (acción del plan, pregunta que toca, qué dijo ella en este turno) y elige las plantillas.
#   2. Cada {{SLOT}} se llena con un dato del backend estructurado (precio, stock, tallas, nombre de la prenda…) y se cambia por
#      un token opaco §SLOT_xxxx§. El modelo nunca ve el valor real.
#   3. El realizador (Qwen3-1.7B) solo cambia la forma de hablar: elige entre las variantes de cada parte, o reescribe el texto
#      conservando los tokens. Un modelo que no esté disponible, o que no pase la compuerta factual, deja el texto base.
#   4. La compuerta factual (factual.py) rechaza cualquier dato nuevo, y recién entonces el código rellena los datos reales.
#
# Campos:
#   tipo         acuse (reconoce lo que dijo ella) | pregunta (una por clave de V1) | mensaje (completo)
#   activa       true = el selector puede usarla en esta etapa del A/B. false = definida y probada, pero V1 sigue hablando.
#   acciones     acciones del plan en las que aplica (preguntar | recomendar | responder | pedir_asesora | seguimiento)
#   clave        solo en `pregunta`: la clave con la que V1 reconoce esa pregunta (memoria.DETECTOR). Una prueba comprueba que
#                CADA variante se reconoce con esa clave: si no, la memoria de V1 se desordenaría.
#   protegidos   slots que deben salir como token y volver intactos
#   prohibido    lo que el modelo no puede introducir (cada etiqueta tiene su regla en factual.py; una prueba lo comprueba)
#   max_frases   tope de frases de esa plantilla
#   forma        cómo se arma: {parte} se cambia por la variante elegida de esa parte
#   partes       variantes de cada parte; una variante con {{SLOT}} solo es elegible si ese dato existe
#   sin_modelo   true = ningún modelo la toca (es una decisión de código)
#   modo         solo en `retoma`: obligatorio | util | ayuda:no_sabe | ayuda:dudosa | ayuda:ambigua (ver «Cambios de tema» en V2.md)
#   fijas        parte → índice de la variante que NO se elige ni por hash ni por el modelo. En las preguntas, la variante 0 es
#                {{PREGUNTA_V1}}: el texto con el que V1 ya hace esa pregunta (memoria.texto_pregunta). Es lógica de negocio con casos
#                («¿Qué evento es?» si ella dijo «evento», otra redacción la segunda vez, la talla del pedido anterior): V2 la conserva.
#                Las demás variantes quedan como respaldo si V1 no trajo su texto.
#
# Regla del dueño (05-10-2026): no se pregunta «¿Es para alguna ocasión especial?». La pregunta de ocasión usa otras palabras.

version: 1

config:
  max_emojis: 1
  max_chars: 360

# Cambios de tema («suspender, no cancelar»; app/v2/temas.py). ANSWER_AND_RESUME = responder lo que ella preguntó y luego retomar UN
# solo pendiente anterior. La respuesta es la de V1 (nunca se reescribe: no pasa por ningún modelo); lo que escribe esta capa es solo
# la frase de retoma (plantillas RESUME_*, tipo «retoma»). Las reglas de abajo las hace cumplir el código y una prueba las comprueba.
temas:
  accion: ANSWER_AND_RESUME
  semantica: [responder_completamente_el_tema_actual, no_ignorar_la_pregunta, recordar_un_solo_pendiente_anterior,
              explicar_brevemente_por_que_se_necesita, ofrecer_respuestas_faciles]
  reglas:
    max_pending_to_resume: 1
    current_question_has_priority: true
    never_resume_before_answering_current: true
    do_not_repeat_exact_previous_question: true
  resume_priority_minima: 50

plantillas:

  # ------------------------------------------------------------------------------------------------------------------------
  # ACUSES: lo primero que se dice cuando ella acaba de darnos un dato. Sin pregunta.
  # ------------------------------------------------------------------------------------------------------------------------
  ACK_NAME:
    tipo: acuse
    activa: true
    acciones: [preguntar]
    objetivo: reconocer_su_nombre
    semantica: [saludar_por_su_nombre]
    protegidos: [NOMBRE]
    prohibido: [inventar_nombre_cliente]
    max_frases: 1
    forma: "{cuerpo} {emoji}"
    partes:
      cuerpo: ["¡Mucho gusto, {{NOMBRE}}!", "¡Qué gusto, {{NOMBRE}}!", "¡Encantada, {{NOMBRE}}!"]
      emoji: ["😊", "🙌", ""]

  CATEGORY_AVAILABLE:
    id_spec: 3
    tipo: acuse
    activa: true
    acciones: [preguntar]
    objetivo: confirmar_categoria
    semantica: [confirmar_que_existe_CATEGORIA]
    protegidos: [CATEGORIA]
    prohibido: [inventar_producto, inventar_talla, inventar_precio, inventar_stock]
    max_frases: 1
    forma: "{cuerpo} {emoji}"
    partes:
      cuerpo: ["¡Sí, tenemos {{CATEGORIA}}!", "¡Claro que sí, tenemos {{CATEGORIA}}!", "¡Sí, hay {{CATEGORIA}}!"]
      emoji: ["😊", "🙌", ""]

  OCCASION_CAPTURED:
