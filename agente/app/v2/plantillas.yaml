    tipo: acuse
    activa: true
    acciones: [preguntar]
    objetivo: reconocer_ocasion
    semantica: [reconocer_OCASION]
    protegidos: [OCASION_ART]
    prohibido: [inventar_fecha, asumir_dia_noche, recomendar_producto_sin_validacion]
    max_frases: 1
    forma: "{cuerpo} {emoji}"
    partes:
      cuerpo: ["¡Qué bonito, para {{OCASION_ART}}!", "¡Perfecto, para {{OCASION_ART}}!", "¡Qué lindo, para {{OCASION_ART}}!", "¡Qué bonito!"]
      emoji: ["😊", "💙", ""]

  ACK_NOTED:
    tipo: acuse
    activa: true
    acciones: [preguntar]
    objetivo: acusar_recibo_de_un_dato
    semantica: [acusar_recibo]
    protegidos: []
    prohibido: [inventar_fecha, asumir_dia_noche, inferir_talla]
    max_frases: 1
