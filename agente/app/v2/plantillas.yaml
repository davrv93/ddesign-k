    protegidos: [PREGUNTA_V1]
    prohibido: [inventar_producto, inventar_talla, inventar_precio, inventar_stock, hacer_multiples_preguntas]
    max_frases: 1
    fijas: {pregunta: 0}        # la pregunta la redacta V1 (memoria.texto_pregunta)
    forma: "{pregunta}"
    partes:
      pregunta: ["{{PREGUNTA_V1}}", "¿Para qué ocasión sería?", "¿Para qué ocasión lo buscas?", "Cuéntame, ¿para qué ocasión sería?"]

  ASK_DAY_NIGHT:
