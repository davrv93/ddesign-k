<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat de prueba</title>
<style>
  :root {
    --bg:#e9e4dc; --wall:#efeae2; --panel:#fff; --ink:#111b21; --muted:#667781; --line:#e2ddd5;
    --me:#d9fdd3; --bot:#fff; --head:#f0f2f5; --acc:#8a3b55; --tick:#53bdeb; --dot:#8696a0;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0b141a; --wall:#0b141a; --panel:#111b21; --ink:#e9edef; --muted:#8696a0; --line:#222d34;
    --me:#005c4b; --bot:#202c33; --head:#202c33; --acc:#d58aa3; --tick:#53bdeb; --dot:#8696a0; } }
  :root[data-theme="dark"] {
    --bg:#0b141a; --wall:#0b141a; --panel:#111b21; --ink:#e9edef; --muted:#8696a0; --line:#222d34;
    --me:#005c4b; --bot:#202c33; --head:#202c33; --acc:#d58aa3; }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif }
  main { height:100%; max-width:1180px; margin:0 auto; display:grid; grid-template-columns: minmax(0,1fr) minmax(260px, 340px); gap:0 }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0,1fr) } aside { display:none } aside.abierto { display:block; position:fixed; inset:0; z-index:5 } }

  .chat { display:flex; flex-direction:column; min-height:0; height:100%; background:var(--wall); border-left:1px solid var(--line); border-right:1px solid var(--line) }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--head); border-bottom:1px solid var(--line) }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--acc); color:#fff; display:grid; place-items:center; font-weight:600; flex:none }
  header .quien { flex:1; min-width:0 }
  header b { display:block; font-weight:600 }
  header small { color:var(--muted); font-size:13px }
  header small.tecleando { color:#25a35a }
  .motor { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:none }
  .motor button { border:0 !important; border-radius:0 !important; padding:6px 10px }
  .motor button[aria-pressed="true"] { background:var(--acc); color:#fff }
  @media (max-width: 520px) { header { flex-wrap:wrap } .motor { order:5; width:100% } .motor button { flex:1 } }
  header button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; cursor:pointer }

  .msgs { flex:1; overflow-y:auto; padding:16px 5%; display:flex; flex-direction:column; gap:2px }
  .dia { align-self:center; background:var(--head); color:var(--muted); font-size:12px; padding:4px 10px; border-radius:8px; margin:6px 0 10px }
  .b { max-width:min(75%, 460px); padding:6px 9px 7px; min-width:72px; border-radius:8px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px .5px rgba(11,20,26,.13); margin-top:6px; animation:entra .18s ease-out }
  .b + .b.mismo { margin-top:2px }
  .b.cliente { align-self:flex-end; background:var(--me) }
  .b.bot { align-self:flex-start; background:var(--bot) }
  /* Como en WhatsApp: la hora flota al final de la última línea y empuja el texto, nunca lo pisa. */
  .b .hora { float:right; position:relative; top:7px; margin-left:12px; font-size:11px; line-height:1; color:var(--muted); white-space:nowrap }
  .b.cliente .hora::after { content:" ✓✓"; color:var(--tick) }
  .b.foto { padding:3px 3px 7px; width:min(75%, 300px) }
  .b.foto img { display:block; width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#fff; cursor:zoom-in }
  .b.foto .pie { padding:6px 6px 0; display:inline }
  .b.foto .hora { margin-right:6px }
  .oferta { align-self:flex-start; display:flex; gap:6px; margin-top:6px }
  .oferta button { border:1px solid var(--acc); background:var(--panel); color:var(--acc); border-radius:16px; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer }
  .oferta button.si { background:var(--acc); color:#fff }
  .oferta button:disabled { opacity:.4; cursor:not-allowed; text-decoration:line-through }
  .escribiendo { align-self:flex-start; background:var(--bot); border-radius:8px; padding:10px 14px; margin-top:6px; display:flex; gap:4px; box-shadow:0 1px .5px rgba(11,20,26,.13) }
  .escribiendo i { width:7px; height:7px; border-radius:50%; background:var(--dot); animation:salta 1.2s infinite }
  .escribiendo i:nth-child(2) { animation-delay:.15s } .escribiendo i:nth-child(3) { animation-delay:.3s }
  @keyframes salta { 0%,60%,100% { transform:none; opacity:.5 } 30% { transform:translateY(-4px); opacity:1 } }
  @keyframes entra { from { opacity:0; transform:translateY(4px) } }
  @media (prefers-reduced-motion: reduce) { .b, .escribiendo i { animation:none } }

  .rapidas { display:flex; gap:6px; overflow-x:auto; padding:8px 12px 0; background:var(--head) }
  .rapidas button { flex:none; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:16px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer }
  form { display:flex; gap:8px; padding:8px 12px 12px; background:var(--head) }
  input { flex:1; min-width:0; padding:10px 14px; border-radius:20px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit }
  form button { width:44px; height:44px; flex:none; border-radius:50%; border:0; background:#00a884; color:#fff; font-size:18px; cursor:pointer }
  form button:disabled { opacity:.5 }
  form .clip { background:none; color:var(--muted); font-size:22px; width:40px }

  aside { background:var(--panel); padding:14px 16px; font-size:13px; overflow-y:auto; overflow-x:hidden; height:100%; min-width:0; overflow-wrap:anywhere }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px }
  aside h2:first-of-type { margin-top:4px }
  aside .cerrar { display:none }
  @media (max-width: 900px) { aside .cerrar { display:inline-block; float:right } }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden } .bar i { display:block; height:100%; background:var(--acc) }
  .row { display:grid; grid-template-columns: 1fr 40px; gap:6px; align-items:center; margin:4px 0 }
  .sub { color:var(--muted) } code { font-size:12px } ul { margin:0; padding-left:18px }

  .zoom { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; place-items:center; z-index:10; cursor:zoom-out }
  .zoom.on { display:grid } .zoom img { max-width:92vw; max-height:92vh; border-radius:6px }
</style>
</head>
<body>
<main>
  <section class="chat">
    <header>
      <div class="avatar">BD</div>
      <div class="quien"><b>Baruka Design</b><small id="estado">en línea</small></div>
      <div class="motor" role="group" aria-label="Motor de conversación">
        <button type="button" data-motor="actual" title="Clasificador + Gemini, el flujo de siempre">Actual</button>
        <button type="button" data-motor="deepseek" title="DeepSeek: conversación más humana">DeepSeek</button>
      </div>
      <button id="nuevo" title="Empezar otra conversación">Nuevo chat</button>
      <button id="verInfo" title="Ver cómo entendió el mensaje">Análisis</button>
    </header>
    <div class="msgs" id="msgs"><div class="dia">HOY</div></div>
    <div class="rapidas" id="rapidas">
      <button>quiero ver los modelos</button>
      <button>busco un vestido para una boda</button>
      <button>tienen jeans acampanados?</button>
      <button>cuanto cuesta el V05</button>
      <button>de que marca es?</button>
      <button>¿dónde quedan sus tiendas?</button>
      <button>¿quién fue el primer presidente del Perú?</button>
      <button>gracias, chau</button>
    </div>
    <form id="f">
      <button type="button" class="clip" id="clip" aria-label="Adjuntar foto" title="Adjuntar foto">📎</button>
      <input type="file" id="archivo" accept="image/*" hidden>
      <input id="t" autocomplete="off" placeholder="Escribe un mensaje o adjunta una foto">
      <button id="enviar" aria-label="Enviar">➤</button>
    </form>
  </section>
  <aside id="info">
    <button class="cerrar" id="cerrarInfo">Cerrar</button>
    <h2>Análisis</h2><p class="sub">Escribe como clienta para ver la intención, la prenda y las fuentes.</p>
  </aside>
</main>
<div class="zoom" id="zoom"><img alt=""></div>
<script>
const $ = id => document.getElementById(id);
const msgs = $('msgs'), info = $('info'), estado = $('estado');
let hist = [], ocupado = false, ultimoRol = '';
// Motor elegido: se recuerda en este navegador; si no hay, manda el del servidor.
let motor = '';
try { motor = localStorage.getItem('motor') || ''; } catch (e) {}
function pintarMotor() { document.querySelectorAll('.motor button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.motor === motor))); }
document.querySelector('.motor').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  motor = b.dataset.motor; pintarMotor();
  try { localStorage.setItem('motor', motor); } catch (e) {}
};
fetch('health').then(r => r.json()).then(h => { if (!motor) { motor = h.motor || 'actual'; pintarMotor(); } }).catch(() => {});
pintarMotor();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// *negrita* y _cursiva_ de WhatsApp
const wa = s => esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>');
const hora = () => new Date().toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' });
const espera = ms => new Promise(r => setTimeout(r, ms));
const bajar = () => { msgs.scrollTop = msgs.scrollHeight; };

function burbuja(rol, html, extra = '') {
  const d = document.createElement('div');
  d.className = `b ${rol} ${extra} ${ultimoRol === rol ? 'mismo' : ''}`;
  d.innerHTML = html + `<span class="hora">${hora()}</span>`;
  msgs.appendChild(d); ultimoRol = rol; bajar(); return d;
}
let puntos = null;
function tecleando(on) {
  estado.textContent = on ? 'escribiendo…' : 'en línea';
  estado.className = on ? 'tecleando' : '';
  if (on && !puntos) { puntos = document.createElement('div'); puntos.className = 'escribiendo'; puntos.innerHTML = '<i></i><i></i><i></i>'; msgs.appendChild(puntos); bajar(); }
  if (!on && puntos) { puntos.remove(); puntos = null; }
}
// Una persona tarda más en escribir un mensaje largo: ~25 ms por carácter, entre 0,6 y 2,2 s.
const pausa = texto => Math.min(2200, Math.max(600, texto.length * 25));

async function enviar(texto) {
  if (ocupado || !texto.trim()) return;
  ocupado = true; $('enviar').disabled = true;
  burbuja('cliente', wa(texto));
  await espera(350); tecleando(true);
  let j;
  try {
    const r = await fetch('chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mensaje: texto, historial: hist, cliente: 'Ana', motor, canal: 'web' }) });
    j = await r.json();
    if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  } catch (e) {
    tecleando(false); burbuja('bot', 'Uy, se me cortó la conexión 😅 ¿Me lo repites?'); ocupado = false; $('enviar').disabled = false; return;
  }
  hist.push({ rol:'cliente', texto });
  await mostrar(j);
}

async function mostrar(j) {
  // Los párrafos salen como mensajes separados, igual que escribe una persona.
  const partes = (j.respuesta || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  for (let i = 0; i < partes.length; i++) {
    if (i > 0) { tecleando(true); await espera(pausa(partes[i])); }
    tecleando(false); burbuja('bot', wa(partes[i])); hist.push({ rol:'bot', texto: partes[i] });
  }
  for (const s of (j.sugerencias || [])) {
    tecleando(true); await espera(700);
    tecleando(false);
    burbuja('bot', `<img src="${esc(s.imagen.replace(/^\//, ''))}" alt="${esc(s.codigo)}" loading="lazy"><span class="pie">${wa(s.pie)}</span>`, 'foto');
    hist.push({ rol:'bot', texto: s.pie });
  }
  tecleando(false);
  // Botones de talla con su precio: «L (S/ 330)». Las agotadas salen tachadas.
  if ((j.tallas || []).length) {
    botones(j.tallas.map(t => ({ texto: `${t.talla}${t.precio != null ? ` (S/ ${Math.round(t.precio) === t.precio ? t.precio : t.precio.toFixed(2)})` : ''}`,
      enviar: `Talla ${t.talla} del ${t.codigo}`, off: !t.disponible })));
  }
  if (j.confirmar_pedido) {
    botones([{ texto: 'Sí, confirmar', enviar: 'Sí, confirmo', si: true }, { texto: 'Cambiar talla', enviar: 'Cambiar talla' }]);
  }
  // «¿Quieres ver otras opciones?»: botones en vez de mandar prendas que no pidió.
  if (j.ofrecer_opciones) {
    const d = document.createElement('div'); d.className = 'oferta';
    d.innerHTML = '<button class="si">Sí, muéstrame</button><button>No, gracias</button>';
    d.onclick = ev => {
      const b = ev.target.closest('button'); if (!b || ocupado) return;
      d.remove(); enviar(b.classList.contains('si') ? 'Sí, quiero ver otras opciones' : 'No, gracias');
    };
    msgs.appendChild(d); bajar();
  }
  hist = hist.slice(-20);
  pintarInfo(j);
  ocupado = false; $('enviar').disabled = false; $('t').focus();
}

// Fila de botones de respuesta rápida bajo el último mensaje del bot; desaparece al usarla.
function botones(lista) {
  const d = document.createElement('div'); d.className = 'oferta';
  lista.forEach(b => {
    const el = document.createElement('button'); el.textContent = b.texto; el.disabled = !!b.off;
    if (b.si) el.className = 'si';
    el.onclick = () => { if (ocupado) return; d.remove(); enviar(b.enviar); };
    d.appendChild(el);
  });
  msgs.appendChild(d); bajar();
}

// Reduce la foto a 1024 px en el navegador: viaja rápido y al modelo no le hace falta más.
function reducir(file) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => mal(new Error('no es una imagen'));
    img.src = url;
  });
}

async function enviarFoto(file) {
  if (ocupado || !file) return;
  ocupado = true; $('enviar').disabled = true;
  const texto = $('t').value.trim(); $('t').value = '';
  let dataUrl;
  try { dataUrl = await reducir(file); } catch (e) { ocupado = false; $('enviar').disabled = false; return; }
  burbuja('cliente', `<img src="${dataUrl}" alt="foto enviada">${texto ? `<span class="pie">${wa(texto)}</span>` : ''}`, 'foto');
  await espera(350); tecleando(true);
  let j;
  try {
    const r = await fetch('foto', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ imagen_b64: dataUrl, mensaje: texto, historial: hist, cliente: 'Ana', motor, canal: 'web' }) });
    j = await r.json();
    if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  } catch (e) {
    tecleando(false); burbuja('bot', 'Uy, no pude ver bien la foto 😅 ¿Me la mandas otra vez?'); ocupado = false; $('enviar').disabled = false; return;
  }
  hist.push({ rol:'cliente', texto: '[foto]' + (texto ? ' ' + texto : '') });
  await mostrar(j);
}

function bars(list) { return list.map(x => `<div class="row"><div>${esc(x.etiqueta)}<div class="bar"><i style="width:${x.p*100}%"></i></div></div><div>${(x.p*100).toFixed(0)}%</div></div>`).join(''); }
function pintarInfo(j) {
  if (j.foto) {
    const f = j.foto;
    info.innerHTML = `<button class="cerrar" id="cerrarInfo">Cerrar</button>
      <h2>Búsqueda por foto</h2>
      <div>Resultado: <b>${esc(f.caso)}</b> · nivel ${esc(f.nivel)}</div>
      <div class="sub">umbral «es este» ≥ ${f.umbrales.exacto.toFixed(3)} · «se parece» ≥ ${f.umbrales.parecido.toFixed(3)} · ${j.ms} ms · ${esc(j.motor || '')} · ${esc(j.modelo_llm)}</div>
      <h2>Más parecidas</h2>${f.top.map(x => `<div class="row"><div><code>${esc(x.codigo)}</code><div class="bar"><i style="width:${Math.max(0, x.sim)*100}%"></i></div></div><div>${x.sim.toFixed(2)}</div></div>`).join('')}
      <h2>Acción</h2><div>${esc(j.accion)}${j.codigo ? ' · ' + esc(j.codigo) : ''}</div>`;
    $('cerrarInfo').onclick = () => info.classList.remove('abierto');
    return;
  }
  info.innerHTML = `<button class="cerrar" id="cerrarInfo">Cerrar</button>
    <h2>Intención</h2>${bars(j.top_intenciones)}
    <div class="sub">motor: <b>${esc(j.motor || '—')}</b> · acción: <b>${esc(j.accion)}</b> · ${esc(j.modelo_llm || 'sin LLM')} · ${j.ms} ms · stock: ${esc(j.stock_fuente || '—')}</div>
    <h2>Prenda</h2><div>${esc(j.categoria_prenda)} (${(j.confianza_categoria*100).toFixed(0)}%)</div>
    <h2>Códigos</h2><div>${j.codigos.length ? j.codigos.map(esc).join(', ') : '—'}</div>
    <h2>Fichas (RAG)</h2><ul>${j.fichas.map(f => `<li><code>${esc(f.codigo)}</code> ${esc(f.nombre)} <span class="sub">${esc(f.fuente)}</span></li>`).join('')}</ul>
    <h2>Ejemplos del dataset</h2><ul>${j.ejemplos.map(e => `<li>[${esc(e.intencion)}] ${esc(e.texto)} <span class="sub">${e.sim}</span></li>`).join('')}</ul>`;
  $('cerrarInfo').onclick = () => info.classList.remove('abierto');
}

$('f').onsubmit = ev => { ev.preventDefault(); const t = $('t'); const v = t.value; t.value = ''; enviar(v); };
$('clip').onclick = () => $('archivo').click();
$('archivo').onchange = ev => { const f = ev.target.files[0]; ev.target.value = ''; enviarFoto(f); };
// arrastrar una foto sobre el chat también la envía
msgs.addEventListener('dragover', ev => ev.preventDefault());
msgs.addEventListener('drop', ev => { ev.preventDefault(); const f = ev.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) enviarFoto(f); });
$('rapidas').onclick = ev => { if (ev.target.tagName === 'BUTTON') enviar(ev.target.textContent); };
$('nuevo').onclick = () => { if (ocupado) return; hist = []; ultimoRol = ''; msgs.innerHTML = '<div class="dia">HOY</div>'; };
$('verInfo').onclick = () => info.classList.add('abierto');
$('cerrarInfo').onclick = () => info.classList.remove('abierto');
msgs.onclick = ev => { if (ev.target.tagName === 'IMG') { $('zoom').querySelector('img').src = ev.target.src; $('zoom').classList.add('on'); } };
$('zoom').onclick = () => $('zoom').classList.remove('on');
$('t').focus();
</script>
</body>
</html>
