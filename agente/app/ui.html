  /* Chat de prueba con la piel de WhatsApp: tema claro del móvil y, si el sistema va en oscuro, el oscuro. */
  :root {
    color-scheme: light dark;
    --fuera:#d9dbd5; --franja:#00a884;
    --cab:#008069; --cab-tinta:#fff; --wall:#efeae2; --garabato:rgba(90,66,30,.115);

  @media (prefers-color-scheme: dark) { :root {
    --fuera:#0a1014; --franja:#0a1014;
    --cab:#202c33; --cab-tinta:#e9edef; --wall:#0b141a; --garabato:rgba(255,255,255,.055);
    --in:#202c33; --out:#005c4b; --tinta:#e9edef; --muted:#8696a0; --meta:#a9b6bd; --ico:#aebac1;
    --tick:#53bdeb; --tick-gris:#8696a0; --enlace:#53bdeb; --verde:#00a884; --verde-tinta:#06cf9c;
    --chip:#182229; --chip-tinta:#aebac1; --aviso:#182229; --aviso-tinta:#ffd279;
    --pill:#2a3942; --menu:#233138; --hover:rgba(255,255,255,.07); --line:#2a3942; --panel:#111b21; --panel-cab:#202c33;
    --cita:rgba(0,0,0,.2); --sombra:0 1px .5px rgba(0,0,0,.4); --foco:#53bdeb; --img:#1a252c;
  } }
  * { box-sizing:border-box }
  [hidden] { display:none !important }
  html, body { height:100%; margin:0 }
  body { background:var(--fuera); color:var(--tinta); font:15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; -webkit-text-size-adjust:100%; overflow:hidden }
  button, input { font:inherit }
  button { -webkit-tap-highlight-color:transparent }
  :focus-visible { outline:2px solid var(--foco); outline-offset:2px }
  svg { display:block; fill:currentColor }

  /* Escritorio: la ventana va centrada, con el ancho de un teléfono, sobre el fondo de WhatsApp Web. */
  .escena { position:relative; height:100vh; height:100dvh; display:grid; place-items:center; transition:padding .26s ease }
  .escena::before { content:''; position:absolute; inset:0 0 auto; height:calc(50% - min(50% - 19px, 480px) + 108px); background:var(--franja) }
  .ventana { position:relative; width:min(100%, 500px); height:min(calc(100vh - 38px), 960px); height:min(calc(100dvh - 38px), 960px);
    display:flex; flex-direction:column; background:var(--wall); border-radius:12px; overflow:hidden;
    box-shadow:0 6px 18px rgba(11,20,26,.14), 0 1px 3px rgba(11,20,26,.12) }
  /* Móvil: pantalla completa, como la app. */
  @media (max-width: 560px), (max-height: 560px) {
    .escena::before { display:none }
    .ventana { width:100%; height:100vh; height:100dvh; border-radius:0; box-shadow:none }
  }

  /* Cabecera */
  .cab { position:relative; z-index:3; flex:none; display:flex; align-items:center; height:60px; padding:0 4px 0 2px; padding-top:env(safe-area-inset-top);
    height:calc(60px + env(safe-area-inset-top)); background:var(--cab); color:var(--cab-tinta) }
  .cab :focus-visible { outline-color:#fff }
  .ico { width:40px; height:40px; flex:none; display:grid; place-items:center; padding:0; border:0; border-radius:50%; background:none; color:inherit; cursor:pointer }
  .ico svg { width:24px; height:24px }
  .cab .atras { width:30px; cursor:default }
  .avatar { width:40px; height:40px; flex:none; display:grid; place-items:center; border-radius:50%; background:#8a3b55; color:#fff; font-weight:600; font-size:15px; letter-spacing:.02em }
  .quien { flex:1; min-width:0; padding:0 4px 0 11px }
  .quien h1 { margin:0; font-size:16.5px; line-height:21px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .quien p { margin:0; font-size:13px; line-height:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

  @media (max-width: 350px) { .cab .ico { width:34px } .quien { padding-left:8px } #camara { display:none } }

  /* Menú ⋮: ahí viven los controles de la demo, para que la cabecera siga siendo la de WhatsApp. */
  .menu { position:absolute; top:calc(6px + env(safe-area-inset-top)); right:6px; z-index:9; min-width:214px; padding:6px 0; background:var(--menu); color:var(--tinta);
    border-radius:10px; box-shadow:0 2px 5px rgba(11,20,26,.26), 0 2px 10px rgba(11,20,26,.16); transform-origin:top right; animation:menu .13s ease-out }
  .menu button { display:flex; align-items:center; justify-content:space-between; gap:20px; width:100%; min-height:44px; padding:10px 16px 10px 20px;
    border:0; background:none; color:inherit; font-size:15.5px; text-align:left; cursor:pointer }
  .menu button:focus-visible { background:var(--hover) }
  .menu button:focus-visible { outline-offset:-2px }
  .menu .marca { width:18px; height:18px; flex:none; color:var(--verde-tinta); visibility:hidden }
  .menu [aria-checked="true"] .marca { visibility:visible }
  .menu hr { border:0; border-top:1px solid var(--line); margin:6px 0 }
  @keyframes menu { from { opacity:0; transform:scale(.9) } }

  /* Cuerpo: el fondo queda fijo y los mensajes corren por encima. */
  .cuerpo { position:relative; flex:1; min-height:0; display:flex; flex-direction:column }
  .fondo { position:absolute; inset:0; background:var(--wall) }
  @supports ((mask-image:url("")) or (-webkit-mask-image:url(""))) {
    .fondo::before { content:''; position:absolute; inset:0; background:var(--garabato);
      -webkit-mask:var(--patron) 0 0 / 236px 236px; mask:var(--patron) 0 0 / 236px 236px }
  }
  .msgs { position:relative; flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column;
    padding:6px 16px 8px; scrollbar-width:thin; scrollbar-color:rgba(134,150,160,.45) transparent }
  .msgs:focus-visible { outline-offset:-3px }
  .dia, .aviso { align-self:center; border-radius:7.5px; box-shadow:var(--sombra); font-size:12.5px }
  .dia { margin:6px 0; padding:5px 12px; line-height:16px; background:var(--chip); color:var(--chip-tinta) }
  .aviso { max-width:min(94%, 400px); margin:2px 0 6px; padding:6px 12px 7px; line-height:17px; text-align:center; background:var(--aviso); color:var(--aviso-tinta) }

  /* Mensajes: «.m» es el mensaje entero (globo + botones de respuesta); «.b», el globo. */
  .m { position:relative; display:flex; flex-direction:column; max-width:min(84%, 400px); margin-top:2px; animation:entra .18s ease-out }
  .m.cola { margin-top:9px }
  .m.cliente { align-self:flex-end }
  .m.bot { align-self:flex-start }
  .m.con-resp { min-width:min(84%, 250px) }
  .m.suelta { width:min(80%, 290px) }
  .b { position:relative; padding:6px 7px 8px 9px; border-radius:7.5px; box-shadow:var(--sombra); white-space:pre-wrap; overflow-wrap:anywhere }
  .bot .b { background:var(--in) }
  .cliente .b { background:var(--out) }
  /* La cola solo en el primer globo de cada tanda, como en WhatsApp. */
  .m.cola.bot .b { border-top-left-radius:0 }
  .m.cola.cliente .b { border-top-right-radius:0 }
  .m.cola .b::before { content:''; position:absolute; top:0; width:8px; height:13px; background:inherit }
  .m.cola.bot .b::before { left:-8px; clip-path:polygon(0 0, 100% 0, 100% 100%); clip-path:path('M8 0H1.6C.3 0-.4 1.4.6 2.4L8 13Z') }
  .m.cola.cliente .b::before { right:-8px; clip-path:polygon(0 0, 100% 0, 0 100%); clip-path:path('M0 0h6.4c1.3 0 2 1.4 1 2.4L0 13Z') }
  /* La hora va abajo a la derecha, dentro del globo. Un hueco invisible del mismo ancho al final del texto
     le guarda el sitio: si no cabe en la última línea, abre otra. Así nunca pisa el texto. */
  .meta { position:absolute; z-index:1; right:7px; bottom:3px; display:flex; align-items:center; gap:3px; font-size:11px; line-height:15px; color:var(--meta); white-space:nowrap; user-select:none }
  .esp { display:inline-block; height:0; padding-left:8px; visibility:hidden; font-size:11px; white-space:nowrap; vertical-align:baseline; user-select:none }
  .cliente .esp { padding-right:20px }
  .ticks { width:17px; height:11px; fill:none; color:var(--tick-gris); transition:color .2s }
  .m.leido .ticks { color:var(--tick) }
  .b b { font-weight:600 }
  /* Quien llega por un anuncio trae la referencia citada en su primer mensaje. */
  .anun { display:block; margin:-2px -3px 5px -5px; padding:5px 10px 6px; border-left:4px solid var(--verde-tinta); border-radius:5px; background:var(--cita); font-size:13px; line-height:17px; white-space:normal }
  .anun b { display:block; color:var(--verde-tinta) }
  .anun span { color:var(--muted) }

  /* Mensaje de imagen: la foto arriba y el pie debajo, en el mismo globo. */
  .m.foto { width:min(80%, 290px) }
  .b.foto { padding:3px 3px 0 }
  .ver { display:block; width:100%; padding:0; border:0; border-radius:5px; background:var(--img); cursor:zoom-in; overflow:hidden }
  .ver img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; object-position:top center }
  .cliente .ver img { aspect-ratio:auto; max-height:340px }
  .b.foto .pie { padding:5px 4px 8px 6px }
  .b.foto .pie b { white-space:nowrap }            /* «S/ 330.00» no se parte en dos líneas */
  .nota { color:var(--muted); font-size:13px }
  .b.foto.sinpie { padding-bottom:3px }
  .b.foto.sinpie::after { content:''; position:absolute; inset:auto 3px 3px; height:30px; border-radius:0 0 5px 5px; background:linear-gradient(transparent, rgba(11,20,26,.55)); pointer-events:none }
  .b.foto.sinpie .meta { right:9px; bottom:6px; color:#fff }
  .b.foto.sinpie .ticks { color:#fff } .m.leido .b.foto.sinpie .ticks { color:var(--tick) }

  /* Botones de respuesta rápida de WhatsApp Business: filas del color del globo, colgadas debajo, texto azul centrado. */
  .resp { display:grid; grid-template-columns:repeat(var(--cols, 1), minmax(0, 1fr)); gap:3px; margin-top:3px }
  .resp button { display:flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:8px 10px; border:0; border-radius:7.5px;
    background:var(--in); color:var(--enlace); box-shadow:var(--sombra); font-size:15px; line-height:20px; text-align:center; overflow-wrap:break-word; cursor:pointer }
  .resp button svg { width:16px; height:16px; flex:none }
  .resp button.si { font-weight:600 }
  .resp button:disabled { color:var(--muted); text-decoration:line-through; cursor:not-allowed }
  .resp.c2 button:last-child:nth-child(odd) { grid-column:1 / -1 }

  .escr .b { display:flex; gap:4px; padding:13px 14px 12px }
  .escr i { width:7px; height:7px; border-radius:50%; background:var(--tick-gris); animation:salta 1.2s infinite }
  .escr i:nth-child(2) { animation-delay:.15s } .escr i:nth-child(3) { animation-delay:.3s }
  @keyframes salta { 0%,60%,100% { transform:none; opacity:.5 } 30% { transform:translateY(-4px); opacity:1 } }
  @keyframes entra { from { opacity:0; transform:translateY(4px) } }

  /* Respuestas de ejemplo para la demo: una fila que se desliza sobre el fondo; se apaga desde el menú. */
  .rapidas { position:relative; flex:none; display:flex; gap:6px; overflow-x:auto; padding:4px 8px; scrollbar-width:none }
  .rapidas::-webkit-scrollbar { display:none }
  .rapidas button { flex:none; min-height:34px; padding:6px 12px; border:0; border-radius:17px; background:var(--in); color:var(--tinta); box-shadow:var(--sombra); font-size:13.5px; line-height:18px; cursor:pointer }

  /* Barra de escritura */
  form { position:relative; flex:none; display:flex; align-items:flex-end; gap:6px; margin:0; padding:3px 6px calc(6px + env(safe-area-inset-bottom)) }
  .caja { flex:1; min-width:0; display:flex; align-items:center; min-height:46px; padding:0 3px; border-radius:23px; background:var(--pill); color:var(--ico); box-shadow:var(--sombra) }
  /* El campo siempre tiene el cursor; el aro se reserva para quien llega con el teclado. */
  .teclado .caja:focus-within { box-shadow:0 0 0 2px var(--verde) }
  .caja input { flex:1; min-width:0; height:46px; padding:0 4px; border:0; outline:0; background:none; color:var(--tinta); font-size:16px }
  .caja input::placeholder { color:var(--muted); opacity:1 }
  .caja .clip svg { transform:rotate(45deg) }
  .redondo { width:46px; height:46px; flex:none; display:grid; place-items:center; padding:0; border:0; border-radius:50%; background:var(--verde); color:#fff; box-shadow:var(--sombra); cursor:pointer }
  .redondo svg { width:24px; height:24px }
  .redondo .avion { display:none; margin-left:3px }
  .redondo:disabled { opacity:.6; cursor:default }
  form.con-texto .avion { display:block }
  form.con-texto .micro, form.con-texto #camara { display:none }
  .emojis { position:relative; flex:none; display:grid; grid-template-columns:repeat(8, 1fr); gap:2px; margin:2px 6px 3px; padding:6px; border-radius:16px; background:var(--pill); box-shadow:var(--sombra) }
  .emojis button { height:38px; padding:0; border:0; border-radius:8px; background:none; font-size:22px; line-height:1; cursor:pointer }

  /* Análisis: cajón inferior dentro de la ventana; en pantallas anchas, panel a la derecha que deja seguir chateando. */
  .velo { position:absolute; inset:0; z-index:7; background:rgba(11,20,26,.45) }
  .cajon { position:absolute; inset:auto 0 0; z-index:8; height:84%; display:flex; flex-direction:column; background:var(--panel); color:var(--tinta);
    border-radius:16px 16px 0 0; box-shadow:0 -4px 24px rgba(11,20,26,.22); overflow:hidden;
    visibility:hidden; transform:translateY(103%); transition:transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s .26s }
  .cajon.abierto { visibility:visible; transform:none; transition:transform .26s cubic-bezier(.2,.8,.2,1) }
  .cajon-cab { position:relative; flex:none; display:flex; align-items:center; gap:4px; padding:14px 8px 8px 18px; background:var(--panel-cab); border-bottom:1px solid var(--line) }
  .cajon-cab::before { content:''; position:absolute; top:6px; left:50%; width:36px; height:4px; margin-left:-18px; border-radius:2px; background:var(--tick-gris); opacity:.5 }
  .cajon-cab h2 { flex:1; margin:0; font-size:16.5px; line-height:22px; font-weight:600 }
  .cajon-cab h2 small { display:block; font-size:12.5px; line-height:16px; font-weight:400; color:var(--muted) }
  .cajon-cab .ico { color:var(--ico) }
  .ajustes { flex:none; display:flex; flex-wrap:wrap; gap:6px; padding:10px 18px 0; font-size:12.5px; line-height:16px }
  .ajustes span { padding:3px 9px; border-radius:11px; background:var(--panel-cab); color:var(--ico) }
  .info { flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; padding:10px 18px 22px; font-size:13.5px; line-height:19px; overflow-wrap:anywhere; scrollbar-width:thin }
  .info h3 { margin:18px 0 6px; font-size:12px; line-height:16px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--verde-tinta) }
  .info h3:first-child { margin-top:4px }
  .info p { margin:4px 0 }
  .info ul { margin:0; padding-left:18px }
  .info code { font-size:12.5px }
  .info b { font-weight:600 }
  .etapas { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; margin:4px 0 8px }
  .etapas span { padding:6px 2px; border-radius:8px; background:var(--panel-cab); color:var(--muted); font-size:11.5px; line-height:15px; text-align:center }
  .etapas span.hecha { background:color-mix(in srgb, var(--verde) 20%, transparent); color:var(--tinta) }
  .etapas span.actual { background:#008069; color:#fff; font-weight:600 }
  .bita { font-size:12.5px } .bita li { margin:2px 0 }
  .bar { height:5px; margin-top:2px; border-radius:3px; background:var(--line); overflow:hidden } .bar i { display:block; height:100%; background:var(--verde) }
  .row { display:grid; grid-template-columns:1fr 40px; gap:6px; align-items:center; margin:4px 0 } .row > :last-child { text-align:right }
  .sub { color:var(--muted) }
  @media (min-width: 1000px) and (min-height: 561px) {
    .velo { display:none }
    .cajon { position:fixed; inset:0 0 0 auto; width:400px; height:auto; border-radius:0; box-shadow:-1px 0 0 var(--line), -10px 0 30px rgba(11,20,26,.1); transform:translateX(103%) }
    .cajon-cab { padding-top:12px; padding-bottom:12px } .cajon-cab::before { display:none }
    body.con-info .escena { padding-right:400px }
  }

  /* Foto ampliada, como el visor de WhatsApp. */
  .zoom { position:absolute; inset:0; z-index:12; display:grid; place-items:center; background:rgba(11,20,26,.95); color:#fff; cursor:zoom-out }
  .zoom img { max-width:96%; max-height:84%; border-radius:4px }
  .zoom .ico { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:8px }
  .zoom :focus-visible { outline-color:#fff }

  .toast { position:absolute; z-index:14; left:50%; bottom:calc(72px + env(safe-area-inset-bottom)); max-width:86%; padding:8px 14px; border-radius:18px; background:rgba(17,27,33,.92); color:#fff;
    font-size:13.5px; line-height:18px; text-align:center; opacity:0; transform:translate(-50%, 8px); transition:opacity .18s, transform .18s; pointer-events:none }
  .toast.on { opacity:1; transform:translate(-50%, 0) }

  /* El resalte al pasar el ratón, solo donde hay ratón: en el teléfono se quedaría pegado tras tocar. */
  @media (hover: hover) {
    .cab .ico:hover, .zoom .ico:hover { background:rgba(255,255,255,.13) }
    .menu button:hover, .caja .ico:hover, .emojis button:hover, .cajon-cab .ico:hover { background:var(--hover) }
    .resp button:hover:not(:disabled), .rapidas button:hover { background:color-mix(in srgb, var(--in) 93%, var(--tinta)) }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important }
  }
</style>

<script>
const $ = id => document.getElementById(id);
const msgs = $('msgs'), info = $('info'), estado = $('estado'), campo = $('t'), form = $('f');
let hist = [], ocupado = false, ultimoRol = '';
// Etapa de la venta: la decide el agente; aquí solo se guarda y se devuelve en cada mensaje.
let etapa = 'prospeccion', bitacora = [];
// Memoria de la conversación (lo que ya sabemos de la clienta y la pregunta pendiente): la actualiza el
// agente; aquí solo se guarda y se devuelve en cada mensaje, igual que la etapa. «Nuevo chat» la borra.
let memoria = null;
// Sesión del chat: identifica la conversación en el CRM (Kommo). «Nuevo chat» abre otra.
const nuevaSesion = () => 'web-' + Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
let sesion = nuevaSesion();
// «Desde anuncio»: simula que la clienta llegó por el anuncio de clic a WhatsApp.
let desdeAnuncio = false;
// Motor elegido: se recuerda en este navegador; si no hay, manda el del servidor.
let motor = '';
try { motor = localStorage.getItem('motor') || ''; } catch (e) {}
const NOMBRE_MOTOR = { actual: 'Actual', deepseek: 'DeepSeek' };
// Versión del agente para este navegador: v1 | v2s (V2 en sombra) | v2a (V2 activo). Se manda en cada mensaje.
let agente = 'v1';
try { agente = localStorage.getItem('agente') || 'v1'; } catch (e) {}
if (!['v1', 'v2s', 'v2a'].includes(agente)) agente = 'v1';
const NOMBRE_AGENTE = { v1: 'V1', v2s: 'V2 en sombra', v2a: 'V2 activo' };
const versionDe = () => agente === 'v1' ? { version: 'v1' } : { version: 'v2', modo: agente === 'v2a' ? 'activo' : 'sombra' };
function pintarAgente() {
  document.querySelectorAll('#menu [data-agente]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.agente === agente)));
  pintarAjustes();
}
function pintarMotor() {
  document.querySelectorAll('#menu [data-motor]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.motor === motor)));
  pintarAjustes();
}
// En el cajón de análisis se ve con qué ajustes se está probando, ya que los controles viven en el menú.
function pintarAjustes() {
  $('ajustes').innerHTML = `<span>Motor: ${esc(NOMBRE_MOTOR[motor] || motor || 'el del servidor')}</span><span>Agente: ${esc(NOMBRE_AGENTE[agente])}</span><span>Desde anuncio: ${desdeAnuncio ? 'sí' : 'no'}</span>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// *negrita* y _cursiva_ de WhatsApp
const wa = s => esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>');
const hora = () => new Date().toLocaleTimeString('es-PE', { hour:'numeric', minute:'2-digit' });
const espera = ms => new Promise(r => setTimeout(r, ms));
const bajar = () => { msgs.scrollTop = msgs.scrollHeight; };
fetch('health').then(r => r.json()).then(h => { if (!motor) { motor = h.motor || 'actual'; pintarMotor(); } }).catch(() => {});
pintarMotor();
pintarAgente();

const TICKS = '<svg class="ticks" viewBox="0 0 17 11" role="img" aria-label="Leído"><path d="M1 5.9 4.4 9.5 11 1.5M6.9 8.3 8 9.5 14.9 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const RESPONDER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>';
const INICIO = '<div class="dia">HOY</div><div class="aviso">✨ Demo del asistente de Baruka Design. Aquí conversas con una asistente virtual: es el mismo bot que atiende por WhatsApp.</div>';
const INFO_VACIA = '<p class="sub">Escribe como clienta para ver la intención, la prenda y las fuentes.</p>';

// Un mensaje: el globo con su hora (y los checks en los enviados). «hueco» es el sitio que la hora reserva al final del texto.
function globo(rol, cuerpo, h, clase = '') {
  const m = document.createElement('div');
  m.className = `m ${rol}${ultimoRol !== rol ? ' cola' : ''}${clase ? ' foto' : ''}`;
  m.innerHTML = `<div class="b ${clase}">${cuerpo}<span class="meta"><span>${h}</span>${rol === 'cliente' ? TICKS : ''}</span></div>`;
  msgs.appendChild(m); ultimoRol = rol; bajar(); return m;
}
const hueco = h => `<span class="esp" aria-hidden="true">${h}</span>`;
function burbuja(rol, html) { const h = hora(); return globo(rol, html + hueco(h), h); }
// Mensaje de imagen de WhatsApp: la foto y, debajo, el pie dentro del mismo globo.
function burbujaFoto(rol, src, alt, pie = '') {
  const h = hora();
  const m = globo(rol, `<button type="button" class="ver" aria-label="Ampliar la foto${alt ? ': ' + esc(alt) : ''}"><img src="${src}" alt="${esc(alt)}"></button>`
    + (pie ? `<div class="pie">${pie}${hueco(h)}</div>` : ''), h, pie ? 'foto' : 'foto sinpie');
  m.querySelector('img').addEventListener('load', bajar);
  return m;
}
let puntos = null;
function tecleando(on) {
  estado.textContent = on ? 'escribiendo…' : 'en línea';
  if (on && !puntos) {
    puntos = document.createElement('div'); puntos.className = `m bot escr${ultimoRol !== 'bot' ? ' cola' : ''}`;
    puntos.innerHTML = '<div class="b" role="img" aria-label="Escribiendo"><i></i><i></i><i></i></div>'; msgs.appendChild(puntos); bajar();
  }
  if (!on && puntos) { puntos.remove(); puntos = null; }
}
// Una persona tarda más en escribir un mensaje largo: ~25 ms por carácter, entre 0,6 y 2,2 s.
const pausa = texto => Math.min(2200, Math.max(600, texto.length * 25));
function ocupar(on) { ocupado = on; $('enviar').disabled = on; }

async function enviar(texto) {
  if (ocupado || !texto.trim()) return;
  ocupar(true);
  // Quien llega por un anuncio trae la referencia citada en su primer mensaje, como en WhatsApp.
  const cita = desdeAnuncio && !hist.length ? '<span class="anun"><b>Anuncio</b><span>Baruka Design · clic a WhatsApp</span></span>' : '';
  const mio = burbuja('cliente', cita + wa(texto));
  await espera(350); mio.classList.add('leido'); tecleando(true);
  let j;
  try {
    const r = await fetch('chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mensaje: texto, historial: hist, cliente: 'Ana', motor, canal: 'web', etapa, conversacion: sesion, desde_anuncio: desdeAnuncio, memoria, ...versionDe() }) });
    j = await r.json();
    if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  } catch (e) {
    tecleando(false); burbuja('bot', 'Uy, se me cortó la conexión 😅 ¿Me lo repites?'); ocupar(false); return;
  }
  hist.push({ rol:'cliente', texto });
  await mostrar(j);
}

async function mostrar(j) {
  // Los párrafos salen como mensajes separados, igual que escribe una persona.
  const partes = (j.respuesta || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  // Con foto, la pregunta final va DESPUÉS de la foto: «te recomiendo este» → foto → «¿qué talla usas?».
  let cierre = '';
  if ((j.sugerencias || []).length && partes.length > 1 && partes[partes.length - 1].includes('?')) cierre = partes.pop();
  for (let i = 0; i < partes.length; i++) {
    if (i > 0) { tecleando(true); await espera(pausa(partes[i])); }
    tecleando(false); burbuja('bot', wa(partes[i])); hist.push({ rol:'bot', texto: partes[i] });
  }
  const conBotones = new Set();
  for (const s of (j.sugerencias || [])) {
    tecleando(true); await espera(700);
    tecleando(false);
    // Prenda que se pide por el bot: título y un botón por talla (las agotadas, tachadas).
    // Las demás (solo en sucursal, agotadas) conservan su pie de texto.
    const tallas = s.tallas || [];
    const m = burbujaFoto('bot', esc(s.imagen.replace(/^\//, '')), s.codigo,
      tallas.length ? `${wa(s.titulo)}\n<span class="nota">Elige tu talla 👇</span>` : wa(s.pie));
    if (tallas.length) {
      m.classList.add('con-resp');
      m.insertAdjacentHTML('beforeend', `<div class="resp tallas" role="group" aria-label="Tallas del ${esc(s.codigo)}" style="--cols:${Math.min(tallas.length, 4)}">${tallas.map(t =>
        `<button type="button" data-enviar="Talla ${esc(t.talla)} del ${esc(s.codigo)}"${t.disponible ? '' : ` disabled title="Agotada" aria-label="Talla ${esc(t.talla)}, agotada"`}>${esc(t.talla)}</button>`).join('')}</div>`);
      conBotones.add(s.codigo); bajar();
    }
    hist.push({ rol:'bot', texto: s.pie });
  }
  if (cierre) { tecleando(true); await espera(pausa(cierre)); tecleando(false); burbuja('bot', wa(cierre)); hist.push({ rol:'bot', texto: cierre }); }
  tecleando(false);
  // Catálogo sin prenda: se pregunta qué quiere ver, con un botón por tipo de prenda.
  if ((j.categorias || []).length) {
    botones(j.categorias.map(c => ({ texto: c.texto, enviar: `Quiero ver ${c.texto.toLowerCase()}` })));
  }
  // Botones de talla con su precio: «L (S/ 330)». Las agotadas salen tachadas.
  // Si la tarjeta de esa prenda ya los trae, no se repiten.
  if ((j.tallas || []).length && !conBotones.has(j.tallas[0].codigo)) {
    botones(j.tallas.map(t => ({ texto: `${t.talla}${t.precio != null ? ` (S/ ${Math.round(t.precio) === t.precio ? t.precio : t.precio.toFixed(2)})` : ''}`,
      enviar: `Talla ${t.talla} del ${t.codigo}`, off: !t.disponible })), true);
  }
  if ((j.botones || []).length) botones(j.botones.map(t => ({ texto: t, enviar: t })));
  if (j.confirmar_pedido) {
    botones([{ texto: 'Sí, confirmar', enviar: 'Sí, confirmo', si: true }, { texto: 'Cambiar talla', enviar: 'Cambiar talla' }]);
  }
  // «¿Quieres ver otras opciones?»: botones en vez de mandar prendas que no pidió.
  if (j.ofrecer_opciones) {
    botones([{ texto: 'Sí, muéstrame', enviar: 'Sí, quiero ver otras opciones', si: true }, { texto: 'No, gracias', enviar: 'No, gracias' }]);
  }
  hist = hist.slice(-20);
  pintarInfo(j);
  ocupar(false); campo.focus();
}

// Botones de respuesta rápida, como los de WhatsApp Business: cuelgan del último mensaje del bot y
// desaparecen al usarlos. Si ese mensaje es una tarjeta (ya trae sus tallas), van en un bloque aparte.
function botones(lista, tallas = false) {
  const d = document.createElement('div'); d.className = 'resp';
  const largo = Math.max(...lista.map(b => b.texto.length));
  const cols = largo <= 4 ? Math.min(lista.length, 4) : tallas || (lista.length === 2 && largo <= 16) || (lista.length > 2 && largo <= 12) ? 2 : 1;
  d.style.setProperty('--cols', cols); if (cols === 2) d.classList.add('c2');
  lista.forEach(b => {
    const el = document.createElement('button'); el.type = 'button'; el.disabled = !!b.off;
    if (largo > 4 && !tallas) el.innerHTML = RESPONDER;
    el.appendChild(document.createTextNode(b.texto));
    if (b.si) el.className = 'si';
    if (b.off) el.title = 'Agotada';
    el.onclick = () => {
      if (ocupado) return;
      const m = d.parentNode; d.remove();
      if (!m.querySelector('.resp')) { m.classList.remove('con-resp'); if (!m.querySelector('.b')) m.remove(); }
      enviar(b.enviar);
    };
    d.appendChild(el);
  });
  let m = msgs.lastElementChild;
  if (!m || !m.classList.contains('bot') || m.classList.contains('foto') || m.classList.contains('escr')) {
    const trasTarjeta = !!m && m.classList.contains('foto');
    m = document.createElement('div'); m.className = 'm bot' + (trasTarjeta ? ' suelta' : ''); msgs.appendChild(m);
  }
  m.classList.add('con-resp'); m.appendChild(d);
  // En dos columnas, si algún texto no cabe en una línea, mejor una fila por botón.
  if (cols === 2 && largo > 4 && [...d.children].some(b => b.offsetHeight > 46)) { d.style.setProperty('--cols', 1); d.classList.remove('c2'); }
  bajar();
}

// Reduce la foto a 1024 px en el navegador: viaja rápido y al modelo no le hace falta más.
function reducir(file) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => mal(new Error('no es una imagen'));
    img.src = url;
  });
}

async function enviarFoto(file) {
  if (ocupado || !file) return;
  ocupar(true);
  const texto = campo.value.trim(); campo.value = ''; alEscribir();
  let dataUrl;
  try { dataUrl = await reducir(file); } catch (e) { ocupar(false); aviso('Ese archivo no es una imagen'); return; }
  const mio = burbujaFoto('cliente', dataUrl, 'foto enviada', texto ? wa(texto) : '');
  await espera(350); mio.classList.add('leido'); tecleando(true);
  let j;
  try {
    const r = await fetch('foto', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ imagen_b64: dataUrl, mensaje: texto, historial: hist, cliente: 'Ana', motor, canal: 'web', etapa, conversacion: sesion, desde_anuncio: desdeAnuncio, memoria }) });
    j = await r.json();
    if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  } catch (e) {
    tecleando(false); burbuja('bot', 'Uy, no pude ver bien la foto 😅 ¿Me la mandas otra vez?'); ocupar(false); return;
  }
  hist.push({ rol:'cliente', texto: '[foto]' + (texto ? ' ' + texto : '') });
  await mostrar(j);
}

function bars(list) { return list.map(x => `<div class="row"><div>${esc(x.etiqueta)}<div class="bar"><i style="width:${x.p*100}%"></i></div></div><div>${(x.p*100).toFixed(0)}%</div></div>`).join(''); }
const ETAPAS = [['prospeccion', 'Prospección'], ['seguimiento', 'Seguimiento'], ['cierre', 'Cierre'], ['venta_confirmada', 'Venta']];
// Panel de la venta: en qué etapa está, qué entendió el clasificador y por qué decidió así.
// Lo que hizo la V2 en este turno (solo si el agente corrió en V2): quién habló, el plan y por qué no habló.
function panelV2(j) {
  const v = j.v2;
  if (!v) return j.version === 'v1' ? '<h3>Agente</h3><div class="sub">V1: el agente de siempre.</div>' : '';
  const sb = v.sombra || {}, g = sb.generacion || {}, plan = sb.plan;
  const quien = v.enviado === 'v2' ? '<b>habló V2</b>' : v.modo === 'activo' ? '<b>habló V1</b> (V2 miró)' : '<b>habló V1</b> (V2 en sombra)';
  return `<h3>Agente V2 · ${esc(v.modo || 'sombra')}</h3>
    <div class="sub">${quien} · ${v.ms} ms${v.llamadas_v1 ? ' · V1 corrió ' + v.llamadas_v1 + ' vez' + (v.llamadas_v1 > 1 ? 'es' : '') : ''}</div>
    ${plan ? `<div>Plan: <b>${esc(plan.accion)}</b>${plan.producto ? ' · ' + esc(plan.producto) : ''} <span class="sub">(V1 hizo: ${esc(sb.v1_accion || '—')}${sb.v1_flujo_fijo ? ', flujo de código' : ''})</span></div>
      <div class="sub">${esc(plan.razon || '')}</div>` : '<div class="sub">Sin plan en este turno.</div>'}
    ${sb.jev ? `<div class="sub">Jev local propuso <b>${esc(sb.jev.opcion)}</b> (${(sb.jev.p * 100).toFixed(0)} %)</div>` : ''}
    ${v.motivo_v1 ? `<div class="sub">V2 no habló: ${esc(v.motivo_v1)}</div>` : sb.no_habla && v.modo === 'activo' ? `<div class="sub">V2 no habló: ${esc(sb.no_habla)}</div>` : ''}
    ${g.intentos ? `<div class="sub">Control de calidad: ${g.passed ? 'pasó' : 'no pasó'}${g.motor ? ' · realizó ' + esc(g.motor) : ''}${g.plantillas ? ' · plantillas ' + g.plantillas.map(esc).join(' + ') : ''}${g.regeneraciones ? ' · ' + g.regeneraciones + ' regeneración(es)' : ''}</div>` : ''}`;
}

function panelVenta(j) {
  if (j.etapa) etapa = j.etapa;
  if (j.memoria) memoria = j.memoria;
  const idx = ETAPAS.findIndex(e => e[0] === etapa), c = j.comercial;
  if (c) bitacora.unshift({ de: c.etapa_anterior, a: etapa, intent: c.intent, p: c.confianza, motivo: c.motivo, cambio: c.transicion });
  bitacora = bitacora.slice(0, 6);
  return `<h3>Etapa de la venta</h3>
    <div class="etapas">${ETAPAS.map((e, i) => `<span class="${i < idx ? 'hecha' : i === idx ? 'actual' : ''}">${e[1]}</span>`).join('')}</div>
    ${c ? `<div class="sub">entendió <b>${esc(c.intent)}</b> · confianza ${(c.confianza * 100).toFixed(0)} % (${esc(c.nivel)})${c.motivo ? '<br>' + esc(c.motivo) : ''}</div>
    <h3>Clasificador comercial</h3>${bars(c.clasificador)}
    ${c.jev ? `<div class="sub">Jev (con contexto${c.fuente === 'jev' ? ', decidió él' : ', el local estaba más seguro'}): <b>${esc(c.jev.intent)}</b> ${(c.jev.confianza * 100).toFixed(0)} % · ${c.jev.ms} ms</div>` : ''}` : ''}
    ${bitacora.length ? `<h3>Decisiones</h3><ul class="bita">${bitacora.map(b => `<li>${b.cambio ? `<b>${esc(b.de)} → ${esc(b.a)}</b>` : esc(b.a)} · ${esc(b.intent)} ${(b.p * 100).toFixed(0)} %</li>`).join('')}</ul>` : ''}
    ${panelMemoria(j)}`;
}

// Memoria: qué sabe el bot de la clienta, qué pregunta dejó abierta y cuál toca después.
const NOMBRE_DATO = { ocasion: 'ocasión', horario: 'día/noche', fecha: 'para cuándo', fecha_iso: 'fecha del evento', prenda: 'prenda',
  talla: 'talla', estatura: 'estatura', color: 'color', presupuesto: 'presupuesto', envio: 'envío', ciudad: 'ciudad', le_gusto: 'le gustó',
  cita: 'cita para probarse' };
// Temperatura de la clienta (reglas del agente): por la fecha del evento y sus señales.
const TEMP = { frio: ['🧊', 'fría'], tibio: ['🌤️', 'tibia'], caliente: ['🔥', 'caliente'] };
function panelMemoria(j) {
  const m = memoria; if (!m) return '';
  const sab = Object.entries(m.sabemos || {}).filter(([, v]) => v);
  const l = j.lectura;
  const leido = l && l.pendiente ? `<div class="sub">esperaba <b>${esc(l.pendiente)}</b>: ${l.respondio ? 'lo respondió' : l.espera ? 'dice que ya lo manda (se espera)' : 'no lo respondió'}</div>` : '';
  const fuentes = l && Object.keys(l.datos || {}).length ? `<div class="sub">de este mensaje: ${Object.entries(l.datos).map(([k, v]) => `${esc(NOMBRE_DATO[k] || k)} ${esc(v)}${l.fuente && l.fuente[k] === 'jev' ? ' (Jev)' : ''}`).join(' · ')}</div>` : '';
  const t = TEMP[m.temperatura];
  const temp = t ? `<h3>Temperatura</h3><div>${t[0]} <b>${esc(t[1])}</b>${m.temperatura_motivo ? ' — ' + esc(m.temperatura_motivo) : ''}</div>` : '';
  const tent = m.cita_tentativa || {};
  const cita = m.sabemos && m.sabemos.cita ? `<div class="sub">🗓️ cita: <b>${esc(m.sabemos.cita)}</b></div>`
    : (tent.dia || tent.hora) ? `<div class="sub">🗓️ cita en curso: ${esc(tent.dia || 'falta el día')} · ${esc(tent.hora || 'falta la hora')}</div>` : '';
  return `${temp}${cita}<h3>Memoria</h3>
    <div>Esperando: <b>${esc(m.pendiente || '—')}</b> · siguiente: <b>${esc(j.siguiente_pregunta || '—')}</b></div>${leido}${fuentes}
    <ul>${sab.length ? sab.map(([k, v]) => `<li>${esc(NOMBRE_DATO[k] || k)}: <b>${esc(v)}</b></li>`).join('') : '<li class="sub">todavía nada</li>'}</ul>
    <div class="sub">ya preguntó: ${esc((m.preguntado || []).join(', ') || '—')}${m.producto ? ` · prenda: ${esc(m.producto)}` : ''}${(m.mostrados || []).length ? ` · mostró: ${esc(m.mostrados.join(', '))}` : ''}${(m.objeciones || []).length ? ` · dudas: ${esc(m.objeciones.join(', '))}` : ''}${m.llego_por ? ` · llegó por: ${esc(m.llego_por)}` : ''}</div>`;
}

function pintarInfo(j) {
  if (j.foto) {
    const f = j.foto;
    info.innerHTML = `<h3>Búsqueda por foto</h3>
      <div>Resultado: <b>${esc(f.caso)}</b> · nivel ${esc(f.nivel)}</div>
      <div class="sub">umbral «es este» ≥ ${f.umbrales.exacto.toFixed(3)} · «se parece» ≥ ${f.umbrales.parecido.toFixed(3)} · ${j.ms} ms · ${esc(j.motor || '')} · ${esc(j.modelo_llm)}</div>
      <h3>Más parecidas</h3>${f.top.map(x => `<div class="row"><div><code>${esc(x.codigo)}</code><div class="bar"><i style="width:${Math.max(0, x.sim)*100}%"></i></div></div><div>${x.sim.toFixed(2)}</div></div>`).join('')}
      <h3>Acción</h3><div>${esc(j.accion)}${j.codigo ? ' · ' + esc(j.codigo) : ''}</div>${panelVenta(j)}`;
    return;
  }
  info.innerHTML = `${panelV2(j)}${panelVenta(j)}
    <h3>Intención general</h3>${bars(j.top_intenciones)}
    <div class="sub">motor: <b>${esc(j.motor || '—')}</b> · acción: <b>${esc(j.accion)}</b> · ${esc(j.modelo_llm || 'sin LLM')} · ${j.ms} ms · stock: ${esc(j.stock_fuente || '—')}</div>
    <h3>Prenda</h3><div>${esc(j.categoria_prenda)} (${(j.confianza_categoria*100).toFixed(0)}%)</div>
    <h3>Códigos</h3><div>${j.codigos.length ? j.codigos.map(esc).join(', ') : '—'}</div>
    <h3>Fichas (RAG)</h3><ul>${j.fichas.map(f => `<li><code>${esc(f.codigo)}</code> ${esc(f.nombre)} <span class="sub">${esc(f.fuente)}</span></li>`).join('')}</ul>
    <h3>Ejemplos del dataset</h3><ul>${j.ejemplos.map(e => `<li>[${esc(e.intencion)}] ${esc(e.texto)} <span class="sub">${e.sim}</span></li>`).join('')}</ul>`;
}

// Aviso breve, como los de la app (para lo que en la demo no existe o acaba de cambiar).
let relojAviso = 0;

  const t = $('toast'); t.textContent = texto; t.classList.add('on');

// Barra de escritura: micrófono con el campo vacío, avión de enviar cuando hay texto.

  $('enviar').setAttribute('aria-label', hay ? 'Enviar' : 'Mensaje de voz (no disponible en esta demo)');
}
campo.addEventListener('input', alEscribir);

$('clip').onclick = () => $('archivo').click();

// arrastrar una foto sobre el chat también la envía
msgs.addEventListener('dragover', ev => ev.preventDefault());
msgs.addEventListener('drop', ev => { ev.preventDefault(); const f = ev.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) enviarFoto(f); });
$('video').onclick = () => aviso('Las videollamadas no están en esta demo');
$('llamada').onclick = () => aviso('Las llamadas no están en esta demo');

// Emojis: una bandeja corta que escribe en el campo.
const bandeja = $('emojis');
bandeja.innerHTML = ['😊','😍','🥰','😂','😅','🤔','😢','🤩','👍','👏','🙌','🙏','👋','💃','👗','👠','💖','❤️','✨','🔥','🎉','💐','💍','📸','🛍️','💳','🚚','📍','⏰','✅','❌','😘']
  .map(e => `<button type="button" aria-label="Emoji ${e}">${e}</button>`).join('');
function emojis(on) { bandeja.hidden = !on; $('emoji').setAttribute('aria-expanded', String(on)); if (on) bajar(); }
$('emoji').onclick = () => emojis(bandeja.hidden);
bandeja.onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const i = campo.selectionStart ?? campo.value.length, f = campo.selectionEnd ?? i;
  campo.value = campo.value.slice(0, i) + b.textContent + campo.value.slice(f);
  campo.focus(); campo.setSelectionRange(i + b.textContent.length, i + b.textContent.length); alEscribir();
};

// Respuestas rápidas de ejemplo: la rueda del ratón las desliza de lado.
const rapidas = $('rapidas');
rapidas.onclick = ev => { if (ev.target.tagName === 'BUTTON') enviar(ev.target.textContent); };
rapidas.addEventListener('wheel', ev => {
  if (Math.abs(ev.deltaY) > Math.abs(ev.deltaX)) { rapidas.scrollLeft += ev.deltaY; ev.preventDefault(); }
}, { passive: false });
let verRapidas = true;
try { verRapidas = localStorage.getItem('rapidas') !== '0'; } catch (e) {}
function pintarRapidas() { rapidas.hidden = !verRapidas; $('verRapidas').setAttribute('aria-checked', String(verRapidas)); }
pintarRapidas();

// Menú ⋮ de la cabecera: los controles de la demo.
const menu = $('menu'), mas = $('mas');
function abrirMenu(on, foco = true) {
  menu.hidden = !on; mas.setAttribute('aria-expanded', String(on));
  if (on && foco) menu.querySelector('button').focus(); else if (!on && foco) mas.focus();
}
// Con el teclado (detail 0) el foco entra al menú; con ratón o dedo se queda en ⋮ y la flecha abajo lo mete.
mas.onclick = ev => abrirMenu(menu.hidden, menu.hidden ? ev.detail === 0 : true);
mas.addEventListener('keydown', ev => { if (ev.key === 'ArrowDown' && !menu.hidden) { ev.preventDefault(); menu.querySelector('button').focus(); } });
addEventListener('keydown', ev => { if (ev.key === 'Tab') document.documentElement.classList.add('teclado'); });
addEventListener('pointerdown', () => document.documentElement.classList.remove('teclado'));
document.addEventListener('pointerdown', ev => { if (!menu.hidden && !menu.contains(ev.target) && !mas.contains(ev.target)) abrirMenu(false, false); });
menu.addEventListener('keydown', ev => {
  const items = [...menu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  const ir = n => { ev.preventDefault(); items[(n + items.length) % items.length].focus(); };
  if (ev.key === 'ArrowDown') ir(i + 1);
  else if (ev.key === 'ArrowUp') ir(i - 1);
  else if (ev.key === 'Home') ir(0);
  else if (ev.key === 'End') ir(items.length - 1);
  else if (ev.key === 'Tab') abrirMenu(false, false);
});
function nuevoChat() {
  if (ocupado) { aviso('Espera a que termine de responder'); return; }
  hist = []; ultimoRol = ''; etapa = 'prospeccion'; bitacora = []; memoria = null; sesion = nuevaSesion();
  msgs.innerHTML = INICIO; info.innerHTML = INFO_VACIA; campo.value = ''; alEscribir(); emojis(false);
}
menu.onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  abrirMenu(false, false);
  if (b.id === 'nuevo') { nuevoChat(); campo.focus(); }
  else if (b.id === 'anuncio') {
    desdeAnuncio = !desdeAnuncio; b.setAttribute('aria-checked', String(desdeAnuncio)); pintarAjustes();
    aviso(desdeAnuncio ? 'Desde anuncio: la clienta llega por el anuncio del vestido' : 'Desde anuncio: apagado'); campo.focus();
  } else if (b.dataset.motor) {
    motor = b.dataset.motor; pintarMotor();
    try { localStorage.setItem('motor', motor); } catch (e) {}
    aviso('Motor: ' + NOMBRE_MOTOR[motor]); campo.focus();
  } else if (b.dataset.agente) {
    agente = b.dataset.agente; pintarAgente();
    try { localStorage.setItem('agente', agente); } catch (e) {}
    aviso('Agente: ' + NOMBRE_AGENTE[agente]); campo.focus();
  } else if (b.id === 'verRapidas') {
    verRapidas = !verRapidas; pintarRapidas();
    try { localStorage.setItem('rapidas', verRapidas ? '1' : '0'); } catch (e) {}
    campo.focus();
  } else if (b.id === 'verInfo') abrirInfo(true);
};

// Cajón de análisis.
const cajon = $('cajon');
function abrirInfo(on) {
  cajon.classList.toggle('abierto', on); $('velo').hidden = !on; document.body.classList.toggle('con-info', on);
  if (on) $('cerrarInfo').focus(); else campo.focus();
}
$('cerrarInfo').onclick = $('velo').onclick = () => abrirInfo(false);

// Fotos: al pulsarlas se amplían, como en el visor de WhatsApp.
const zoom = $('zoom');
let volverA = null;
function ampliar(src, alt, desde) { const i = zoom.querySelector('img'); i.src = src; i.alt = alt || ''; zoom.hidden = false; volverA = desde; $('cerrarZoom').focus(); }
function cerrarZoom() { zoom.hidden = true; if (volverA && volverA.isConnected) volverA.focus(); volverA = null; }
zoom.onclick = cerrarZoom;
msgs.addEventListener('click', ev => {
  const v = ev.target.closest('.ver');
  if (v) { const i = v.querySelector('img'); ampliar(i.src, i.alt, v); return; }
  // Botones de talla de las tarjetas: siguen activos mientras la tarjeta esté en pantalla.
  const b = ev.target.closest('.tallas button'); if (!b || b.disabled || ocupado) return;
  enviar(b.dataset.enviar);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!zoom.hidden) cerrarZoom();
  else if (!menu.hidden) abrirMenu(false);
  else if (!bandeja.hidden) { emojis(false); campo.focus(); }
  else if (cajon.classList.contains('abierto')) abrirInfo(false);
});

msgs.innerHTML = INICIO; info.innerHTML = INFO_VACIA; alEscribir();
campo.focus();
</script>
</body>
</html>
