# Baruka Design · CRM WhatsApp (kddesign)
#
# Stack aislado: red, volúmenes y nombres propios (prefijo kddesign_) para no tocar
# los contenedores existentes del EC2. Sólo el frontend publica un puerto, y sólo en
# 127.0.0.1: el nginx del host hace de proxy HTTPS hacia él.
#
#   KD_HTTP_PORT (18480)  → panel + API          (127.0.0.1, lo usa el nginx del host)
#   KD_EVO_PORT  (18481)  → manager evolution-go (127.0.0.1, sólo para diagnóstico por túnel SSH)
#   KD_AGENT_PORT (18482) → agente conversacional: UI de prueba y API (127.0.0.1, túnel SSH)

name: kddesign

services:
  evolution-db:
    image: postgres:16-alpine
    container_name: kddesign_evolution_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evogo
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?define EVOLUTION_DB_PASSWORD en .env}
      POSTGRES_DB: evogo_users
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evogo -d evogo_users"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    networks: [kddesign]

  evolution:
    # Fork de evolution-go (davrv93). Se compila desde GitHub; para fijar versión usa #<commit>.
    build:
      context: ${EVOLUTION_GIT_CONTEXT:-https://github.com/davrv93/evolution-go.git#main}
    image: kddesign/evolution-go:local
    container_name: kddesign_evolution
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      POSTGRES_AUTH_DB: postgresql://evogo:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evogo:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evogo_users?sslmode=disable
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:?define EVOLUTION_GLOBAL_API_KEY en .env}
      DATABASE_SAVE_MESSAGES: "false"
      CLIENT_NAME: kddesign
      OS_NAME: Baruka Design CRM
      WADEBUG: INFO
      LOGTYPE: console
      # El backend descarga las fotos con /message/downloadmedia sólo cuando las necesita.
      WEBHOOK_FILES: "false"
      CONNECT_ON_STARTUP: "true"
      EVENT_IGNORE_GROUP: "true"
      EVENT_IGNORE_STATUS: "true"
      MINIO_ENABLED: "false"
      TZ: America/Lima
      GOMEMLIMIT: 100MiB
    ports:
      - "127.0.0.1:${KD_EVO_PORT:-18481}:8080"
    mem_limit: 160m
    networks: [kddesign]

  backend:
    build: ./backend
    image: kddesign/backend:local
    container_name: kddesign_backend
    restart: unless-stopped
    depends_on:
      - evolution
    env_file: .env
    environment:
      PORT: "8080"
      DATA_DIR: /data
      EVOLUTION_URL: http://evolution:8080
      WEBHOOK_BASE_URL: http://backend:8080
      MEDIA_BASE_URL: http://backend:8080
      AGENT_URL: ${AGENT_URL-http://agente:8000}
    volumes:
      - backend_data:/data
    mem_limit: 128m
    networks: [kddesign]

  agente:
    # Embeddings locales (multilingual-e5-small cuantizado, ONNX) + clasificadores + máquina de etapas + RAG + LLM.
    # El bot le delega el texto libre; si no responde, el bot vuelve a Gemini.
    build:
      context: ./agente
      args:
        EMBED_MODEL: ${EMBED_MODEL:-Xenova/multilingual-e5-small}
        # 0 = la tienda usa solo su catálogo; el de 100 modelos ficticios (BOT.zip) queda fuera.
        CATALOGO100: ${KD_CATALOGO100:-1}
        # auto = SetFit si en el build gana al e5 sin ajustar; base | setfit lo fuerzan.
        CLASIFICADOR: ${KD_CLASIFICADOR:-auto}
        # Pasos del ajuste SetFit (~7 min en un Mac, más en el EC2). 0 = no entrenarlo.
        SETFIT_PASOS: ${KD_SETFIT_PASOS:-300}
    image: kddesign/agente:local
    container_name: kddesign_agente
    restart: unless-stopped
    environment:
      # LLM por defecto: Gemini Flash-Lite de Google AI Studio, capa GRATUITA, con la misma GEMINI_API_KEY del
      # backend. Si las dos cuotas por minuto se agotan, responde con la frase del dataset (sin costo).
      # Para usar DeepSeek por OpenRouter (de pago): LLM_URL=https://openrouter.ai/api/v1/chat/completions,
      # LLM_API_KEY=<clave de OpenRouter>, LLM_MODEL=deepseek/deepseek-chat-v3.1,deepseek/deepseek-v4-flash
      LLM_URL: ${LLM_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-${GEMINI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-6}
      # Motor por defecto: "actual" (lo de arriba) o "deepseek" (DeepSeek por OpenRouter, tono más humano).
      # La UI de prueba lo cambia por mensaje; el bot usa este.
      MOTOR: ${MOTOR:-actual}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${OPENROUTER_API_KEY:-}}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-chat-v3.1,deepseek/deepseek-v4-flash}
      CATALOG_URL: http://backend:8080/api/public/catalog
      # Stock como herramienta: disponibilidad real (físico - reservas) y sucursales, consultada al responder.
      STOCK_URL: http://backend:8080/api/public/stock
      # Vestido del anuncio: «este vestido» es ese aunque la clienta no lo nombre. Vacío = sin producto por defecto.
      PRODUCTO_DEMO: ${KD_PRODUCTO_DEMO:-}
      # 0 = la tienda no tiene sucursales con stock propio (un showroom con cita): no se mencionan.
      SUCURSALES: ${KD_SUCURSALES:-0}
      # Jev (TypeSafe, por OpenRouter con la misma clave): off | sombra | cascada. En cascada, si el
      # clasificador local duda (< 0,80), Jev decide la intención con toda la conversación. JEV_VERIFICAR=1
      # quita de la respuesta del LLM lo que afirme de la prenda sin estar en la ficha. Ver agente/README.md.
      JEV_MODO: ${KD_JEV_MODO:-off}
      JEV_VERIFICAR: ${KD_JEV_VERIFICAR:-0}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_URL: ${JEV_URL:-https://openrouter.ai/api/v1/systemone}
      PUBLIC_URL: ${PUBLIC_URL:-https://kddesign.pjgfactsalud.com.pe}
      BUSINESS_NAME: ${BUSINESS_NAME:-Baruka Design}
      CURRENCY: ${CURRENCY:-S/}
      EMBED_THREADS: "2"
      CATALOGO100: ${KD_CATALOGO100:-1}
      TZ: America/Lima
    volumes:
      - agente_data:/data
    ports:
      - "127.0.0.1:${KD_AGENT_PORT:-18482}:8000"
    mem_limit: 1800m  # texto (e5-small) + imagen (Unicom) en ONNX: ~1,13 GiB medidos el 04-10-2026 (con jina eran 1,48)
    networks: [kddesign]

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_URL: ${PUBLIC_URL:-https://kddesign.pjgfactsalud.com.pe}
        # "/" con dominio propio; "/baruka/" si el panel va detrás de un alias del nginx de otro sitio.
        BASE_PATH: ${KD_BASE_PATH:-/}
    image: kddesign/frontend:local
    container_name: kddesign_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${KD_HTTP_PORT:-18480}:80"
    mem_limit: 64m
    networks: [kddesign]

volumes:
  evolution_db:
  backend_data:
  agente_data:

networks:
  kddesign:
    name: kddesign_net
